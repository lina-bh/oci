---
{
  namePrefix: "miniflux-",
  labels: [{
    pairs: {
      app.kubernetes.io/name: "miniflux",
    },
    includeSelectors: true,
  }],
  resources: [
    "pg.yaml",
    "app.yaml",
    "svc.yaml",
    "ingress.yaml",
    "refresh.yaml",
    "cleanup.yaml",
    "container.yaml",
    "pod.yaml",
  ],
  configMapGenerator: [{
    name: "env",
    envs: [
      "env.sh",
    ],
  }],
  images: [{
    name: "miniflux",
    newName: "ghcr.io/miniflux/miniflux",
    newTag: "2.3.5-distroless@sha256:c826edc9c2284a8181e297d22a5ade1482bd9a8a4beabb2b6356bd22ce731310",
  }],
  replacements: [{
    source: {
      kind: "ConfigMap",
      name: "container",
      fieldPath: "data.securityContext",
    },
    targets: [{
      select: {
        kind: "Deployment",
      },
      fieldPaths: [
        "spec.template.spec.containers.*.securityContext",
        "spec.template.spec.initContainers.*.securityContext",
      ],
      options: {
        create: true,
      },
    }, {
      select: {
        kind: "CronJob",
      },
      fieldPaths: [
        "spec.jobTemplate.spec.template.spec.containers.*.securityContext",
      ],
      options: {
        create: true,
      },
    }],
  }, {
    source: {
      kind: "ConfigMap",
      name: "container",
      fieldPath: "data.envFrom",
    },
    targets: [{
      select: {
        kind: "Deployment",
      },
      fieldPaths: [
        "spec.template.spec.containers.*.envFrom",
        "spec.template.spec.initContainers.*.envFrom",
      ],
      options: {
        create: true,
      },
    }, {
      select: {
        kind: "CronJob",
      },
      fieldPaths: [
        "spec.jobTemplate.spec.template.spec.containers.*.envFrom",
      ],
      options: {
        create: true,
      },
    }],
  }, {
    source: {
      kind: "ConfigMap",
      name: "container",
      fieldPath: "data.volumeMounts",
    },
    targets: [{
      select: {
        kind: "Deployment",
      },
      fieldPaths: [
        "spec.template.spec.containers.*.volumeMounts",
        "spec.template.spec.initContainers.*.volumeMounts",
      ],
      options: {
        create: true,
      },
    }, {
      select: {
        kind: "CronJob",
      },
      fieldPaths: [
        "spec.jobTemplate.spec.template.spec.containers.*.volumeMounts",
      ],
      options: {
        create: true,
      },
    }],
  }, {
    source: {
      kind: "ConfigMap",
      name: "pod",
      fieldPath: "data.volumes",
    },
    targets: [{
      select: {
        kind: "Deployment",
      },
      fieldPaths: [
        "spec.template.spec.volumes",
      ],
      options: {
        create: true,
      },
    }, {
      select: {
        kind: "CronJob",
      },
      fieldPaths: [
        "spec.jobTemplate.spec.template.spec.volumes",
      ],
      options: {
        create: true,
      },
    }],
  }, {
    source: {
      kind: "ConfigMap",
      name: "pod",
      fieldPath: "data.automountServiceAccountToken",
    },
    targets: [{
      select: {
        kind: "Deployment",
      },
      fieldPaths: [
        "spec.template.spec.automountServiceAccountToken",
      ],
      options: {
        create: true,
      },
    }, {
      select: {
        kind: "CronJob",
      },
      fieldPaths: [
        "spec.jobTemplate.spec.template.spec.automountServiceAccountToken",
      ],
      options: {
        create: true,
      },
    }],
  }],
  patches: [],
}
