---
{
  apiVersion: "kustomize.toolkit.fluxcd.io/v1",
  kind: "Kustomization",
  metadata: {
    name: "longhorn",
    namespace: "flux-system",
  },
  spec: {
    dependsOn: [{
      name: "kube-prometheus-stack",
    }],
    interval: "24h",
    path: "./k8s/infrastructure/controllers/longhorn/",
    prune: true,
    sourceRef: {
      kind: "GitRepository",
      name: "flux-system",
    },
    timeout: "5m0s",
    wait: true,
  },
}
