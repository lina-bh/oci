apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
    namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
  interval: 24h
  targetNamespace: external-secrets
  timeout: 10m0s
  upgrade:
    crds: CreateReplace
