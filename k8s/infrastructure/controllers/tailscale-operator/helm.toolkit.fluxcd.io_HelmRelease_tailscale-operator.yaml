apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: flux-system
  name: tailscale-operator
spec:
  interval: 168h
  targetNamespace: tailscale
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.3
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    operatorConfig:
      hostname: oke
    apiServerProxyConfig:
      mode: "true"
