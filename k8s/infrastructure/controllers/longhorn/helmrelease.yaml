---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  install:
    crds: CreateReplace
    createNamespace: true
  interval: 24h
  targetNamespace: longhorn-system
  timeout: 10m0s
  upgrade:
    crds: CreateReplace
  values:
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    defaultSettings:
      allowVolumeCreationWithDegradedAvailability: false
      autoCleanupSystemGeneratedSnapshot: true
      concurrentReplicaRebuildPerNodeLimit: 1
      guaranteedInstanceManagerCPU: 5
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: block-if-contains-last-replica
      orphanResourceAutoDeletion: replica-data;instance
      removeSnapshotsDuringFilesystemTrim: true
    global:
      imageRegistry: docker.io
    longhornGlobalManager:
      replicas: 1
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
    networkPolicies:
      enabled: true
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 2
      migratable: true
      unmapMarkSnapChainRemoved: enabled
    preUpgradeChecker:
      jobEnabled: false
