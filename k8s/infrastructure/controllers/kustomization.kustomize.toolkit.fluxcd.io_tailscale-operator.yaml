---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets-config
  path: ./k8s/infrastructure/controllers/tailscale-operator/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
