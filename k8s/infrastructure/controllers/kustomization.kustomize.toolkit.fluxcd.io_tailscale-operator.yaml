---
{
  apiVersion: "kustomize.toolkit.fluxcd.io/v1",
  kind: "Kustomization",
  metadata: {
    namespace: "flux-system",
    name: "tailscale-operator",
  },
  spec: {
    interval: "1m0s",
    path: "./k8s/infrastructure/controllers/tailscale-operator/",
    prune: true,
    wait: true,
    timeout: "5m0s",
    sourceRef: {
      kind: "GitRepository",
      name: "flux-system",
    },
    dependsOn: [{
      name: "external-secrets-config",
    }],
  },
}
