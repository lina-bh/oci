---
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "metrics-server",
    namespace: "flux-system",
  },
  spec: {
    chart: {
      spec: {
        chart: "metrics-server",
        version: "3.14.0",
        sourceRef: {
          kind: "HelmRepository",
          name: "metrics-server",
        },
      },
    },
    interval: "24h",
    targetNamespace: "kube-system",
    install: {
      crds: "CreateReplace",
    },
    upgrade: {
      crds: "CreateReplace",
    },
    values: {
      metrics: {
        enabled: true,
      },
      serviceMonitor: {
        enabled: true,
      },
    },
  },
}
