---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: 3.14.0
  install:
    crds: CreateReplace
  interval: 24h
  targetNamespace: kube-system
  timeout: 10m0s
  upgrade:
    crds: CreateReplace
  values:
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
