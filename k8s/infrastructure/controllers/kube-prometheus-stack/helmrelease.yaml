---
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "kube-prometheus-stack",
    namespace: "flux-system",
  },
  spec: {
    interval: "24h",
    chartRef: {
      kind: "OCIRepository",
      namespace: "flux-system",
      name: "kube-prometheus-stack",
    },
    targetNamespace: "monitoring",
    install: {
      crds: "CreateReplace",
    },
    upgrade: {
      crds: "CreateReplace",
    },
    values: {
      grafana: {
        enabled: false,
      },
      alertmanager: {
        kubeScheduler: {
          enabled: false,
        },
        kubeControllerManager: {
          enabled: false,
        },
        alertmanagerSpec: {
          secrets: [
            "discord",
          ],
        },
        defaultRules: {
          rules: {
            kubeSchedulerAlerting: false,
            kubeSchedulerRecording: false,
            kubeControllerManager: false,
          },
        },
        config: {
          receivers: [{
            name: "null",
          }, {
            name: "discord",
            discord_configs: [{
              webhook_url_file: "/etc/alertmanager/secrets/discord/webhook_url",
            }],
          }],
          route: {
            receiver: "discord",
          },
        },
      },
    },
  },
}
