---
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "cloudnative-pg",
    namespace: "flux-system",
  },
  spec: {
    interval: "24h",
    targetNamespace: "cnpg-system",
    install: {
      crds: "CreateReplace",
      createNamespace: true,
    },
    upgrade: {
      crds: "CreateReplace",
    },
    values: {
      monitoring: {
        podMonitorEnabled: true,
      },
    },
    chartRef: {
      kind: "OCIRepository",
      name: "cloudnative-pg",
      namespace: "flux-system",
    },
  },
}
