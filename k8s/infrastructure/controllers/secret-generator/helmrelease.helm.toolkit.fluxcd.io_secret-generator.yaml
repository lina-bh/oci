apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secret-generator
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: secret-generator
  install:
    createNamespace: true
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: mittwald
      chart: kubernetes-secret-generator
      version: 3.4.1
