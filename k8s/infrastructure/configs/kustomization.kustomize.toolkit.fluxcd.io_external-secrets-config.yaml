---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets
  path: ./k8s/infrastructure/configs/external-secrets/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
