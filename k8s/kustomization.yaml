---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  resources: [
    "./flux-system",
    "./infrastructure",
    "./apps",
  ],
  patches: [{
    target: {
      group: "kustomize.toolkit.fluxcd.io",
      kind: "Kustomization",
      namespace: "flux-system",
    },
    patch: "[{ \"op\": \"replace\", \"path\": \"/spec/interval\", \"value\": \"10m0s\" }]",
  }],
}
