---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- patch: |-
    - op: add
      path: /spec/interval
      value: 1h0m0s
    - op: add
      path: /spec/retryInterval
      value: 1m0s
    - op: add
      path: /spec/timeout
      value: 15m0s
  target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    namespace: flux-system
- patch: |-
    - op: replace
      path: /spec/interval
      value: 10m0s
    - op: remove
      path: /spec/retryInterval
    - op: remove
      path: /spec/timeout
  target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: flux-system
    namespace: flux-system
resources:
- flux-system
- infrastructure
- apps
- descheduler
